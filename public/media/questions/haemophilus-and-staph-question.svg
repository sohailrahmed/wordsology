<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Cartoon: Staphylococcus aureus on a sheep blood agar plate says: I'm Staphylococcus aureus. I'm amazing. Haemophilus love to be around me. The Haemophilus colonies around it say: We are Haemophilus. We normally can't grow on sheep blood agar because it is missing key factors. The presence of Staphylococcus aureus produces those factors as a metabolic byproduct. What are the two key factors?">
  <defs>
    <radialGradient id="agar" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#E25B4A"/>
      <stop offset="1" stop-color="#C8473A"/>
    </radialGradient>
  </defs>
  <rect width="600" height="520" rx="22" fill="#fff"/>

  <!-- sheep blood agar plate -->
  <circle cx="196" cy="338" r="176" fill="#9E3A2F"/>
  <circle cx="192" cy="332" r="172" fill="url(#agar)" stroke="#F07A68" stroke-width="5"/>

  <!-- Staph aureus colony (angry face) -->
  <path d="M120 286 L118 262 L134 268 L160 270 C 190 266, 214 262, 236 272 L 252 282 L 258 312 L 268 330 C 262 352, 266 372, 250 388 C 226 402, 196 396, 170 392 L 146 380 L 136 356 L 124 340 L 128 318 Z" fill="#EFE1A6"/>
  <path d="M150 300 L178 312 M232 300 L204 312" stroke="#F2C20F" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="166" cy="326" rx="15" ry="11" fill="#fff"/>
  <ellipse cx="216" cy="326" rx="15" ry="11" fill="#fff"/>
  <circle cx="169" cy="328" r="5" fill="#F2C20F"/>
  <circle cx="219" cy="328" r="5" fill="#F2C20F"/>
  <ellipse cx="192" cy="364" rx="30" ry="9" fill="#fff"/>

  <!-- Haemophilus colonies satelliting around it -->
  <g fill="#C4C4C4" stroke="#6F6F6F" stroke-width="2">
    <circle cx="196" cy="234" r="19"/><circle cx="84" cy="334" r="19"/>
    <circle cx="300" cy="334" r="19"/><circle cx="196" cy="438" r="19"/>
  </g>
  <g fill="#B23A2E">
    <circle cx="189" cy="230" r="3"/><circle cx="203" cy="230" r="3"/><ellipse cx="196" cy="242" rx="5" ry="2.6"/>
    <circle cx="77" cy="330" r="3"/><circle cx="91" cy="330" r="3"/><ellipse cx="84" cy="342" rx="5" ry="2.6"/>
    <circle cx="293" cy="330" r="3"/><circle cx="307" cy="330" r="3"/><ellipse cx="300" cy="342" rx="5" ry="2.6"/>
    <circle cx="189" cy="434" r="3"/><circle cx="203" cy="434" r="3"/><ellipse cx="196" cy="446" rx="5" ry="2.6"/>
  </g>

  <!-- Staph's speech bubble -->
  <path d="M104 156 L134 282 L168 164 Z" fill="#FFF1C9"/>
  <ellipse cx="160" cy="92" rx="152" ry="80" fill="#FFF1C9"/>
  <g font-size="21" font-weight="700" fill="#1B1B1B" text-anchor="middle">
    <text x="160" y="66">I’m <tspan font-style="italic">Staphylococcus</tspan></text>
    <text x="160" y="93"><tspan font-style="italic">aureus</tspan>. I’m amazing.</text>
    <text x="160" y="120"><tspan font-style="italic">Haemophilus</tspan> love</text>
    <text x="160" y="147">to be around me.</text>
  </g>

  <!-- Haemophilus speech bubble -->
  <path d="M352 210 L214 236 L360 262 Z" fill="#D9D9D9"/>
  <ellipse cx="448" cy="204" rx="150" ry="150" fill="#D9D9D9"/>
  <g font-size="19" fill="#1B1B1B" text-anchor="middle">
    <text x="452" y="108">We are <tspan font-style="italic">Haemophilus</tspan>.</text>
    <text x="452" y="132">We normally can’t grow</text>
    <text x="452" y="156">on <tspan font-weight="700">SHEEP BLOOD</tspan></text>
    <text x="452" y="180"><tspan font-weight="700">AGAR</tspan> because it is</text>
    <text x="452" y="204">missing key factors.</text>
    <text x="452" y="228">The presence of</text>
    <text x="452" y="252" font-style="italic">Staphylococcus aureus</text>
    <text x="452" y="276">produces those factors</text>
    <text x="452" y="300">as a metabolic byproduct.</text>
  </g>

  <!-- the question -->
  <path d="M372 432 L216 440 L380 458 Z" fill="#D9D9D9"/>
  <ellipse cx="466" cy="440" rx="124" ry="58" fill="#D9D9D9"/>
  <g font-size="22" font-weight="800" font-style="italic" fill="#1B1B1B" text-anchor="middle">
    <text x="466" y="434">What are the two</text>
    <text x="466" y="462">key factors?</text>
  </g>
</svg>
