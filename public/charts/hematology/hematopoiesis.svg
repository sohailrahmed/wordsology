<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="610" viewBox="0 0 1150 610" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Hematopoiesis. A pluripotent stem cell gives rise to the hematopoietic stem cell, which splits into the myeloid progenitor cell and the lymphoid stem cell. The myeloid progenitor gives rise to megakaryocytes, erythrocytes, monocytes and granulocytes. The lymphoid stem cell gives rise to pre-T cells, which become T lymphocytes, and pre-B cells, which become B lymphocytes. This antigen-independent lymphopoiesis takes place in the primary lymphoid tissue: T cells form in the thymus and B cells in the bone marrow. The cells then enter the blood, then go on to secondary lymphoid tissue, the spleen and lymph nodes, where antigen-dependent lymphopoiesis occurs.">
<rect width="1150" height="610" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8B96"/></marker></defs>
<text x="40" y="42" font-size="26" font-weight="800" fill="#16212B" text-anchor="start">Hematopoiesis</text>
<rect x="314.0" y="64" width="260" height="40" rx="20.0" fill="#0E6A80"/>
<text x="444" y="90.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Pluripotent stem cell</text>
<line x1="444" y1="104" x2="444" y2="122" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="304.0" y="128" width="280" height="40" rx="20.0" fill="#0E6A80"/>
<text x="444" y="154.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Hematopoietic stem cell</text>
<path d="M444 168 V190 M249 190 H638" stroke="#7C8B96" stroke-width="2.5" fill="none"/>
<line x1="249" y1="190" x2="249" y2="206" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="638" y1="190" x2="638" y2="206" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="114.0" y="212" width="270" height="40" rx="10" fill="#fff" stroke="#0E6A80" stroke-width="2.5"/>
<text x="249" y="238.0" font-size="17" font-weight="800" fill="#0E6A80" text-anchor="middle">Myeloid progenitor cell</text>
<rect x="523.0" y="212" width="230" height="40" rx="10" fill="#fff" stroke="#0E6A80" stroke-width="2.5"/>
<text x="638" y="238.0" font-size="17" font-weight="800" fill="#0E6A80" text-anchor="middle">Lymphoid stem cell</text>
<path d="M249 252 V274 M72 274 H426" stroke="#7C8B96" stroke-width="2.5" fill="none"/>
<line x1="72" y1="274" x2="72" y2="292" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16.0" y="298" width="112" height="38" rx="10" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="72" y="322.0" font-size="14" font-weight="700" fill="#16212B" text-anchor="middle">Megakaryocyte</text>
<line x1="190" y1="274" x2="190" y2="292" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="134.0" y="298" width="112" height="38" rx="10" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="190" y="322.0" font-size="14" font-weight="700" fill="#16212B" text-anchor="middle">Erythrocyte</text>
<line x1="308" y1="274" x2="308" y2="292" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="252.0" y="298" width="112" height="38" rx="10" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="308" y="322.0" font-size="14" font-weight="700" fill="#16212B" text-anchor="middle">Monocyte</text>
<line x1="426" y1="274" x2="426" y2="292" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="370.0" y="298" width="112" height="38" rx="10" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="426" y="322.0" font-size="14" font-weight="700" fill="#16212B" text-anchor="middle">Granulocyte</text>
<rect x="500" y="282" width="632" height="140" rx="12" fill="#EFF6FF"/>
<rect x="500" y="282" width="6" height="140" rx="3" fill="#1D4ED8"/>
<text x="784" y="322.0" font-size="16" font-weight="800" fill="#1D4ED8" text-anchor="start">Antigen-INDEPENDENT lymphopoiesis</text>
<text x="784" y="346.0" font-size="16" font-weight="400" fill="#16212B" text-anchor="start">takes place in the primary lymphoid tissue:</text>
<text x="784" y="370.0" font-size="16" font-weight="400" fill="#16212B" text-anchor="start">T cells form in the thymus,</text>
<text x="784" y="394.0" font-size="16" font-weight="400" fill="#16212B" text-anchor="start">B cells in the bone marrow</text>
<rect x="500" y="432" width="632" height="52" rx="12" fill="#FEF2F2"/>
<rect x="500" y="432" width="6" height="52" rx="3" fill="#B91C1C"/>
<text x="784" y="464.0" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="start">The cells then enter the blood</text>
<rect x="500" y="494" width="632" height="100" rx="12" fill="#FCE8F1"/>
<rect x="500" y="494" width="6" height="100" rx="3" fill="#BE185D"/>
<text x="784" y="526.0" font-size="16" font-weight="400" fill="#16212B" text-anchor="start">Then they go on to secondary lymphoid tissue</text>
<text x="784" y="550.0" font-size="16" font-weight="400" fill="#16212B" text-anchor="start">(spleen and lymph nodes), where</text>
<text x="784" y="574.0" font-size="16" font-weight="800" fill="#BE185D" text-anchor="start">antigen-DEPENDENT lymphopoiesis occurs</text>
<path d="M638 252 V268 M574 268 H702" stroke="#7C8B96" stroke-width="2.5" fill="none"/>
<line x1="574" y1="268" x2="574" y2="290" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="514.0" y="296" width="120" height="36" rx="10" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="574" y="319.0" font-size="15" font-weight="700" fill="#16212B" text-anchor="middle">pre-T cell</text>
<line x1="574" y1="332" x2="574" y2="360" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="513.0" y="366" width="122" height="40" rx="10" fill="#fff" stroke="#0E6A80" stroke-width="2.5"/>
<text x="574" y="392.0" font-size="15" font-weight="800" fill="#0E6A80" text-anchor="middle">T lymphocyte</text>
<line x1="574" y1="406" x2="574" y2="580" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="702" y1="268" x2="702" y2="290" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="642.0" y="296" width="120" height="36" rx="10" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="702" y="319.0" font-size="15" font-weight="700" fill="#16212B" text-anchor="middle">pre-B cell</text>
<line x1="702" y1="332" x2="702" y2="360" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="641.0" y="366" width="122" height="40" rx="10" fill="#fff" stroke="#0E6A80" stroke-width="2.5"/>
<text x="702" y="392.0" font-size="15" font-weight="800" fill="#0E6A80" text-anchor="middle">B lymphocyte</text>
<line x1="702" y1="406" x2="702" y2="580" stroke="#7C8B96" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
