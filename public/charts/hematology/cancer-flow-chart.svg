<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Increased WBC count plus an absolute granulocytosis? If yes: blasts in peripheral blood? If no, it is a non-malignant granulocytic abnormality. If yes, two paths. Blasts under 10 percent in blood and bone marrow: chronic myeloproliferative neoplasm (chronic myeloproliferative disorder): chronic myelogenous leukemia, primary myelofibrosis (idiopathic myelofibrosis), polycythemia vera, essential thrombocythemia. Blasts in bone marrow over 30 percent (FAB) or at least 20 percent (WHO): acute myelogenous leukemia, AML-M1 through AML-M7.">
<rect width="1000" height="800" fill="#fff"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6A75"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BE185D"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B21B6"/></marker></defs>
<rect x="250" y="20" width="660" height="62" rx="14" fill="#FEFCE8" stroke="#EAB308" stroke-width="3.5"/>
<text x="580" y="59" font-size="22" font-weight="800" fill="#16212B" text-anchor="middle">↑ WBC count + an absolute granulocytosis?</text>
<path d="M580 82 V136" stroke="#5B6A75" stroke-width="2.5" fill="none" marker-end="url(#ah0)"/>
<rect x="554" y="97" width="52" height="26" rx="13" fill="#15803D"/>
<text x="580" y="115" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Yes</text>
<ellipse cx="580" cy="182" rx="200" ry="42" fill="#fff" stroke="#16212B" stroke-width="2.5"/>
<text x="580" y="189" font-size="21" font-weight="800" fill="#16212B" text-anchor="middle">Blasts in peripheral blood?</text>
<path d="M380 182 H276" stroke="#5B6A75" stroke-width="2.5" fill="none" marker-end="url(#ah0)"/>
<rect x="302" y="165" width="52" height="26" rx="13" fill="#B91C1C"/>
<text x="328" y="183" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">No</text>
<rect x="20" y="140" width="250" height="84" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="145" y="176" font-size="17" font-weight="700" fill="#16212B" text-anchor="middle">It’s a non-malignant</text>
<text x="145" y="200" font-size="17" font-weight="700" fill="#16212B" text-anchor="middle">granulocytic abnormality</text>
<path d="M580 224 V262 M260 262 H760" stroke="#5B6A75" stroke-width="2.5" fill="none"/>
<path d="M260 262 V296" stroke="#5B6A75" stroke-width="2.5" fill="none" marker-end="url(#ah0)"/>
<path d="M760 262 V296" stroke="#5B6A75" stroke-width="2.5" fill="none" marker-end="url(#ah0)"/>
<rect x="554" y="235" width="52" height="26" rx="13" fill="#15803D"/>
<text x="580" y="253" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Yes</text>
<rect x="60" y="300" width="400" height="110" rx="14" fill="#FDF2F7" stroke="#BE185D" stroke-width="3"/>
<text x="260" y="346" font-size="22" font-weight="800" fill="#BE185D" text-anchor="middle">Blasts &lt; 10%</text>
<text x="260" y="378" font-size="17" font-weight="400" fill="#16212B" text-anchor="middle">in blood and bone marrow (BM)</text>
<path d="M260 410 V446" stroke="#BE185D" stroke-width="3" fill="none" marker-end="url(#ah1)"/>
<text x="260" y="474" font-size="19" font-weight="800" fill="#BE185D" text-anchor="middle">Chronic myeloproliferative neoplasm</text>
<text x="260" y="496" font-size="15" font-weight="400" fill="#4A5864" text-anchor="middle">(chronic myeloproliferative disorder)</text>
<rect x="40" y="514" width="440" height="170" rx="14" fill="#fff" stroke="#BE185D" stroke-width="2"/>
<text x="64" y="552" font-size="18" font-weight="600" fill="#16212B" text-anchor="start">Chronic myelogenous leukemia (CML)</text>
<text x="64" y="588" font-size="18" font-weight="600" fill="#16212B" text-anchor="start">Primary myelofibrosis <tspan font-size="14" fill="#4A5864">(idiopathic myelofibrosis)</tspan></text>
<text x="64" y="624" font-size="18" font-weight="600" fill="#16212B" text-anchor="start">Polycythemia vera</text>
<text x="64" y="660" font-size="18" font-weight="600" fill="#16212B" text-anchor="start">Essential thrombocythemia</text>
<rect x="540" y="300" width="440" height="110" rx="14" fill="#F5F3FF" stroke="#5B21B6" stroke-width="3"/>
<text x="760" y="330" font-size="17" font-weight="700" fill="#4A5864" text-anchor="middle">Blasts in BM</text>
<text x="760" y="362" font-size="22" font-weight="800" fill="#5B21B6" text-anchor="middle">&gt; 30% <tspan font-size="16" font-weight="600" fill="#4A5864">(FAB)</tspan></text>
<text x="760" y="392" font-size="22" font-weight="800" fill="#5B21B6" text-anchor="middle">≥ 20% <tspan font-size="16" font-weight="600" fill="#4A5864">(WHO)</tspan></text>
<path d="M760 410 V508" stroke="#5B21B6" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
<rect x="560" y="514" width="400" height="252" rx="14" fill="#fff" stroke="#5B21B6" stroke-width="2"/>
<text x="760" y="550" font-size="19" font-weight="800" fill="#5B21B6" text-anchor="middle">Acute myelogenous leukemia (AML)</text>
<rect x="622" y="570" width="116" height="36" rx="10" fill="#F5F3FF"/>
<text x="680" y="594" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">AML-M1</text>
<rect x="622" y="618" width="116" height="36" rx="10" fill="#F5F3FF"/>
<text x="680" y="642" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">AML-M2</text>
<rect x="622" y="666" width="116" height="36" rx="10" fill="#F5F3FF"/>
<text x="680" y="690" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">AML-M3</text>
<rect x="622" y="714" width="116" height="36" rx="10" fill="#F5F3FF"/>
<text x="680" y="738" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">AML-M4</text>
<rect x="782" y="570" width="116" height="36" rx="10" fill="#F5F3FF"/>
<text x="840" y="594" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">AML-M5</text>
<rect x="782" y="618" width="116" height="36" rx="10" fill="#F5F3FF"/>
<text x="840" y="642" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">AML-M6</text>
<rect x="782" y="666" width="116" height="36" rx="10" fill="#F5F3FF"/>
<text x="840" y="690" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">AML-M7</text>
<text x="20" y="788" font-size="13" font-weight="400" fill="#4A5864" text-anchor="start">FAB = French-American-British classification · WHO = World Health Organization</text>
</svg>
