<circle cx="782.0" cy="458" r="19" fill="#EBDDF3" stroke="#B48ACB" stroke-width="2"/>
<circle cx="776.0" cy="454" r="2.4" fill="#7E4FA3"/>
<circle cx="787.0" cy="461" r="2.4" fill="#7E4FA3"/>
<circle cx="780.0" cy="467" r="2.4" fill="#7E4FA3"/>
<circle cx="789.0" cy="450" r="2.4" fill="#7E4FA3"/>
<text x="782.0" y="494" font-size="12" font-weight="600" fill="#4A5864" text-anchor="middle">giant platelet</text>
<text x="740.0" y="524" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Cigar-shaped,</text>
<text x="740.0" y="547" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Döhle-like inclusions</text>
<text x="740.0" y="570" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle"></text>
<text x="740.0" y="593" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Giant platelets,</text>
<text x="740.0" y="616" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">thrombocytopenia</text>
<text x="740.0" y="639" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">+ bleeding</text>
<rect x="890" y="352" width="250" height="260" rx="14" fill="#fff" stroke="#D5DDE3" stroke-width="1.5"/>
<path d="M890 366 a14 14 0 0 1 14 -14 h222 a14 14 0 0 1 14 14 v28 h-250 Z" fill="#7C3AED"/>
<text x="1015.0" y="380" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Alder-Reilly</text>
