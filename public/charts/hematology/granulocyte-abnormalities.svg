<text x="1015.0" y="524" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Large 1° granules in a</text>
<text x="1015.0" y="547" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">single or multiple</text>
<text x="1015.0" y="570" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">cell lines <tspan fill="#DB2777" font-weight="800">*</tspan></text>
<path d="M1015 612 V640" stroke="#DB2777" stroke-width="2.5"/>
<path d="M1008 622 L1015 610 L1022 622" stroke="#DB2777" stroke-width="2.5" fill="none"/>
<rect x="890" y="640" width="250" height="96" rx="14" fill="#FDF2F8" stroke="#DB2777" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1015" y="668" font-size="16" font-weight="400" fill="#9D174D" text-anchor="middle"><tspan font-weight="800">* Differentiate from toxic</tspan></text>
<text x="1015" y="691" font-size="16" font-weight="400" fill="#9D174D" text-anchor="middle"><tspan font-weight="800">granulation</tspan>, which is</text>
<text x="1015" y="714" font-size="16" font-weight="400" fill="#9D174D" text-anchor="middle">present in neutrophils alone</text>
<text x="20" y="772" font-size="13" font-weight="400" fill="#4A5864" text-anchor="start">1° = primary (azurophilic) granules · 2° = secondary (specific) granules · NADPH = nicotinamide adenine dinucleotide phosphate</text>
</svg>
