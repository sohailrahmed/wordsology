<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Interpreting a TSI agar slant: a yellow slant means lactose or sucrose was fermented, a red slant means it was not. A yellow deep means glucose was fermented, a red deep means it was not. A black precipitate means H2S; a cracked or lifted medium means gas.">
  <defs>
    <clipPath id="inside"><path d="M335 62 V330 a45 45 0 0 0 90 0 V62 Z"/></clipPath>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".22" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="agar" x1="0" x2="1">
      <stop offset="0" stop-color="#D9CBB4"/><stop offset=".45" stop-color="#ECE2D2"/><stop offset="1" stop-color="#D2C2A8"/>
    </linearGradient>
  </defs>
  <rect width="760" height="490" fill="#fff"/>

  <!-- tube -->
  <g clip-path="url(#inside)">
    <rect x="330" y="55" width="100" height="340" fill="#F3F6F8"/>
    <path d="M335 150 L425 222 V390 H335 Z" fill="url(#agar)"/>
    <path d="M335 254 Q380 244 425 258" stroke="#A8957A" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  </g>
  <path d="M335 62 V330 a45 45 0 0 0 90 0 V62" fill="url(#glass)" stroke="#8E9BA3" stroke-width="3"/>
  <rect x="328" y="18" width="104" height="52" rx="8" fill="#E8ECEE" stroke="#9EA9AF" stroke-width="2.5"/>
  <rect x="328" y="58" width="104" height="10" rx="3" fill="#CDD4D8"/>
  <path d="M348 82 V320" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <text x="380" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#6B5A43" letter-spacing="1">SLANT</text>
  <text x="380" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#6B5A43" letter-spacing="1">DEEP</text>

  <!-- leader lines -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="292" y1="170" x2="352" y2="182" stroke="#C9A100"/>
    <line x1="292" y1="300" x2="352" y2="300" stroke="#C9A100"/>
    <line x1="468" y1="170" x2="408" y2="200" stroke="#B71C1C"/>
    <line x1="468" y1="300" x2="408" y2="300" stroke="#B71C1C"/>
  </g>
  <g fill="#14201A"><circle cx="352" cy="182" r="5"/><circle cx="352" cy="300" r="5"/><circle cx="408" cy="200" r="5"/><circle cx="408" cy="300" r="5"/></g>

  <!-- left: fermented = yellow -->
  <g font-size="19" fill="#14201A">
    <rect x="16" y="122" width="276" height="96" rx="12" fill="#FFE45C"/>
    <text x="34" y="156" font-weight="700">Lactose/sucrose</text>
    <text x="34" y="180" font-weight="700">fermented?</text>
    <text x="34" y="204">then: yellow slant</text>
    <rect x="16" y="252" width="276" height="96" rx="12" fill="#FFE45C"/>
    <text x="34" y="286" font-weight="700">Glucose</text>
    <text x="34" y="310" font-weight="700">fermented?</text>
    <text x="34" y="334">then: yellow deep</text>
  </g>

  <!-- right: not fermented = red -->
  <g font-size="19" fill="#fff">
    <rect x="468" y="122" width="276" height="96" rx="12" fill="#C62828"/>
    <text x="486" y="156" font-weight="700">Lactose/sucrose</text>
    <text x="486" y="180" font-weight="700">NOT fermented?</text>
    <text x="486" y="204">then: red slant</text>
    <rect x="468" y="252" width="276" height="96" rx="12" fill="#C62828"/>
    <text x="486" y="286" font-weight="700">Glucose</text>
    <text x="486" y="310" font-weight="700">NOT fermented?</text>
    <text x="486" y="334">then: red deep</text>
  </g>

  <!-- notes -->
  <g font-size="19" fill="#14201A">
    <circle cx="40" cy="428" r="11" fill="#1B1B1B"/>
    <text x="64" y="435"><tspan font-weight="700">Black precipitate</tspan> = the organism produces H₂S</text>
    <path d="M30 458 l8 6 l-3 7 l9 4 l-4 5" stroke="#14201A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="476"><tspan font-weight="700">Cracked or lifted medium</tspan> = the organism produces gas</text>
  </g>
</svg>
