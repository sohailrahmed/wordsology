<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Interpreting a TSI agar slant. Left half yellow, right half red. A yellow slant means lactose or sucrose was fermented; a red slant means it was not. A yellow deep means glucose was fermented; a red deep means it was not. Cracks in the medium mean the organism produces gas. A black precipitate at the bottom means the organism produces H2S.">
  <defs>
    <clipPath id="inside"><path d="M335 62 V585 a45 45 0 0 0 90 0 V62 Z"/></clipPath>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".22" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" x2="1"><stop offset="0" stop-color="#E0A800"/><stop offset=".6" stop-color="#F7CC33"/><stop offset="1" stop-color="#F2C024"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#D32F2F"/><stop offset=".4" stop-color="#C62828"/><stop offset="1" stop-color="#931A1A"/></linearGradient>
  </defs>
  <rect width="760" height="650" fill="#fff"/>

  <!-- tube contents -->
  <g clip-path="url(#inside)">
    <rect x="330" y="55" width="100" height="600" fill="#F3F6F8"/>
    <!-- slant surface runs from (335,150) down to (425,222); left half yellow, right half red -->
    <path d="M335 150 L380 186 V660 H335 Z" fill="url(#yel)"/>
    <path d="M380 186 L425 222 V660 H380 Z" fill="url(#red)"/>
    <!-- slant / deep boundary -->
    <path d="M335 198 L425 270" stroke="#fff" stroke-opacity=".9" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
    <!-- gas cracks -->
    <g stroke="#5A3A00" stroke-opacity=".55" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M336 408 l12 6 l-3 12 l15 7 l-4 10"/>
      <path d="M424 396 l-13 11 l7 10 l-14 9"/>
      <path d="M372 452 l10 -7 l12 9 l9 -6"/>
    </g>
    <g stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M336 408 l12 6 l-3 12 l15 7 l-4 10"/>
      <path d="M424 396 l-13 11 l7 10 l-14 9"/>
      <path d="M372 452 l10 -7 l12 9 l9 -6"/>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="352" cy="400" r="3"/><circle cx="398" cy="430" r="2.4"/><circle cx="366" cy="440" r="2"/></g>
    <!-- H2S: black precipitate in the bottom of the deep -->
    <path d="M330 505 C350 494 362 510 380 500 C398 491 410 506 430 498 V660 H330 Z" fill="#1B1B1B"/>
  </g>
  <!-- glass, cap, shine -->
  <path d="M335 62 V585 a45 45 0 0 0 90 0 V62" fill="url(#glass)" stroke="#8E9BA3" stroke-width="3"/>
  <rect x="328" y="18" width="104" height="52" rx="8" fill="#E8ECEE" stroke="#9EA9AF" stroke-width="2.5"/>
  <rect x="328" y="58" width="104" height="10" rx="3" fill="#CDD4D8"/>
  <path d="M346 82 V575" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>

  <!-- leader lines + dots -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="292" y1="200" x2="358" y2="190" stroke="#B88A00"/>
    <line x1="292" y1="350" x2="358" y2="350" stroke="#B88A00"/>
    <line x1="292" y1="490" x2="352" y2="420" stroke="#5B6A61"/>
    <line x1="468" y1="200" x2="404" y2="228" stroke="#8E1A1A"/>
    <line x1="468" y1="350" x2="404" y2="350" stroke="#8E1A1A"/>
    <line x1="468" y1="560" x2="404" y2="560" stroke="#1B1B1B"/>
  </g>
  <g fill="#14201A" stroke="#fff" stroke-width="2"><circle cx="358" cy="190" r="6"/><circle cx="358" cy="350" r="6"/><circle cx="352" cy="420" r="6"/><circle cx="404" cy="228" r="6"/><circle cx="404" cy="350" r="6"/></g>
  <circle cx="404" cy="560" r="6" fill="#fff" stroke="#1B1B1B" stroke-width="2"/>

  <!-- left: fermented = yellow; gas -->
  <g font-size="19" fill="#14201A">
    <rect x="16" y="152" width="276" height="96" rx="12" fill="#FFE45C"/>
    <text x="34" y="186" font-weight="700">Lactose/sucrose</text>
    <text x="34" y="210" font-weight="700">fermented?</text>
    <text x="34" y="234">then: yellow slant</text>
    <rect x="16" y="302" width="276" height="96" rx="12" fill="#FFE45C"/>
    <text x="34" y="336" font-weight="700">Glucose</text>
    <text x="34" y="360" font-weight="700">fermented?</text>
    <text x="34" y="384">then: yellow deep</text>
    <rect x="16" y="452" width="276" height="96" rx="12" fill="#EEF1F2" stroke="#5B6A61" stroke-width="2"/>
    <text x="34" y="486" font-weight="700">Medium cracked</text>
    <text x="34" y="510" font-weight="700">or lifted?</text>
    <text x="34" y="534">then: organism makes gas</text>
  </g>

  <!-- right: not fermented = red; H2S -->
  <g font-size="19" fill="#fff">
    <rect x="468" y="152" width="276" height="96" rx="12" fill="#C62828"/>
    <text x="486" y="186" font-weight="700">Lactose/sucrose</text>
    <text x="486" y="210" font-weight="700">NOT fermented?</text>
    <text x="486" y="234">then: red slant</text>
    <rect x="468" y="302" width="276" height="96" rx="12" fill="#C62828"/>
    <text x="486" y="336" font-weight="700">Glucose</text>
    <text x="486" y="360" font-weight="700">NOT fermented?</text>
    <text x="486" y="384">then: red deep</text>
    <rect x="468" y="512" width="276" height="96" rx="12" fill="#1B1B1B"/>
    <text x="486" y="546" font-weight="700">Black precipitate?</text>
    <text x="486" y="570">then: organism</text>
    <text x="486" y="594">makes H₂S</text>
  </g>
</svg>
