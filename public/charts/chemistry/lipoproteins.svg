<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Lipoproteins. Chylomicrons, 90 percent triglyceride, apoprotein B-48: exogenous dietary triglycerides from the intestine are transported to circulation and tissues and ultimately degraded in the liver. They lead to VLDL, 70 percent triglyceride, apoprotein B-100: synthesized in the liver from endogenous triglycerides, deposits triglycerides into tissues and eventually turns into LDL. LDL, 50 percent cholesterol, apoprotein B-100: brings cholesterol into peripheral cells for membrane and hormone synthesis, but can also bring cholesterol to artery walls. HDL, 50 percent protein, apoprotein A-1: synthesized in the liver, removes excess cholesterol from peripheral tissues and counteracts LDL.">
<rect width="900" height="820" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0E6A80"/></marker></defs>
<text x="40" y="40" font-size="26" font-weight="800" fill="#16212B" text-anchor="start">Lipoproteins</text>
<text x="40" y="70" font-size="16" font-weight="400" fill="#4A5864" text-anchor="start">Water-insoluble dietary lipids plus their transport vehicle, the apolipoproteins</text>
<rect x="40" y="100" width="470" height="200" rx="14" fill="#fff" stroke="#D5DDE3" stroke-width="1.5"/>
<path d="M40 114 a14 14 0 0 1 14 -14 h442 a14 14 0 0 1 14 14 v32 h-470 Z" fill="#0E6A80"/>
<text x="58" y="131" font-size="20" font-weight="800" fill="#fff" text-anchor="start">Chylomicrons</text>
<rect x="298" y="109" width="200" height="28" rx="14" fill="#fff"/>
<text x="398.0" y="129" font-size="15" font-weight="800" fill="#1D4ED8" text-anchor="middle">90% triglyceride</text>
<rect x="40" y="308" width="150" height="30" rx="15" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="115" y="328" font-size="14" font-weight="700" fill="#4A5864" text-anchor="middle">Apoprotein B-48</text>
<text x="275.0" y="176" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">(Exogenous) dietary triglycerides from the intestine</text>
<line x1="275.0" y1="188" x2="275.0" y2="204" stroke="#4A5864" stroke-width="2" marker-end="url(#ah)"/>
<text x="275.0" y="226" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Transported out to circulation and various tissues</text>
<line x1="275.0" y1="238" x2="275.0" y2="254" stroke="#4A5864" stroke-width="2" marker-end="url(#ah)"/>
<text x="275.0" y="276" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Ultimately degraded in the liver</text>
<line x1="275.0" y1="340" x2="275.0" y2="364" stroke="#0E6A80" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="370" width="470" height="170" rx="14" fill="#fff" stroke="#D5DDE3" stroke-width="1.5"/>
<path d="M40 384 a14 14 0 0 1 14 -14 h442 a14 14 0 0 1 14 14 v32 h-470 Z" fill="#0E6A80"/>
<text x="58" y="401" font-size="20" font-weight="800" fill="#fff" text-anchor="start">VLDL</text>
<rect x="298" y="379" width="200" height="28" rx="14" fill="#fff"/>
<text x="398.0" y="399" font-size="15" font-weight="800" fill="#1D4ED8" text-anchor="middle">70% triglyceride</text>
<rect x="40" y="548" width="150" height="30" rx="15" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="115" y="568" font-size="14" font-weight="700" fill="#4A5864" text-anchor="middle">Apoprotein B-100</text>
<text x="275.0" y="446" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Synthesized in the liver from endogenous triglycerides</text>
<line x1="275.0" y1="458" x2="275.0" y2="474" stroke="#4A5864" stroke-width="2" marker-end="url(#ah)"/>
<text x="275.0" y="496" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Goes out to the blood and deposits triglycerides</text>
<text x="275.0" y="518" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">into body tissues, eventually turning into LDL</text>
<line x1="275.0" y1="580" x2="275.0" y2="604" stroke="#0E6A80" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="610" width="470" height="150" rx="14" fill="#fff" stroke="#D5DDE3" stroke-width="1.5"/>
<path d="M40 624 a14 14 0 0 1 14 -14 h442 a14 14 0 0 1 14 14 v32 h-470 Z" fill="#B91C1C"/>
<text x="58" y="641" font-size="20" font-weight="800" fill="#fff" text-anchor="start">LDL</text>
<rect x="309" y="619" width="189" height="28" rx="14" fill="#fff"/>
<text x="403.5" y="639" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="middle">50% cholesterol</text>
<rect x="40" y="768" width="150" height="30" rx="15" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="115" y="788" font-size="14" font-weight="700" fill="#4A5864" text-anchor="middle">Apoprotein B-100</text>
<text x="275.0" y="686" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Brings cholesterol into peripheral cells for</text>
<text x="275.0" y="708" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">membrane and hormone synthesis</text>
<text x="275.0" y="740" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">But it can also bring cholesterol to artery walls</text>
<rect x="580" y="370" width="290" height="150" rx="14" fill="#fff" stroke="#D5DDE3" stroke-width="1.5"/>
<path d="M580 384 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v32 h-290 Z" fill="#15803D"/>
<text x="598" y="401" font-size="20" font-weight="800" fill="#fff" text-anchor="start">HDL</text>
<rect x="713" y="379" width="145" height="28" rx="14" fill="#fff"/>
<text x="785.5" y="399" font-size="15" font-weight="800" fill="#15803D" text-anchor="middle">50% protein</text>
<rect x="580" y="528" width="150" height="30" rx="15" fill="#EEF2F5" stroke="#C9D3DA" stroke-width="1.2"/>
<text x="655" y="548" font-size="14" font-weight="700" fill="#4A5864" text-anchor="middle">Apoprotein A-1</text>
<text x="725.0" y="446" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">Synthesized in the liver; removes</text>
<text x="725.0" y="468" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">excess cholesterol from</text>
<text x="725.0" y="490" font-size="16" font-weight="400" fill="#16212B" text-anchor="middle">peripheral tissues</text>
<path d="M760 560 L534 684" stroke="#15803D" stroke-width="4" fill="none"/>
<path d="M524 666 L544 702" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
<text x="680" y="640" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">HDL counteracts LDL</text>
</svg>
